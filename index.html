<!DOCTYPE html>
<html>
<head id="head">
    <meta charset="UTF-8">
    <link rel="stylesheet" type="text/css" href="style.css">
    <script src="js/pages.js"></script>
</head>
<body id="body">
    <div class="align-center-text">
        <h1>甘箨的小窝耶qw!</h1>
        <p style="text-align: center;"><img decoding="async" src="https://avatars.githubusercontent.com/u/65482653" alt="Bamcane" style="border-radius: 25%" width="128" height="128"></p>
        <p>C/C++使用者，Teeworlds/DDNet模组开发者，2D横版游戏爱好者，坚定的Teeworlds修改拥护者</p>
        <p class=""><a href="https://space.bilibili.com/431064862">bilibili个人主页</a><a href="https://afdian.com/@bamcane" style="margin-left: 32px;">爱发电个人主页</a></p>
        <iframe src="https://store.steampowered.com/widget/4640030/" frameborder="0" width="646" height="190"></iframe>
        <div class="bordered-background">
            <div id="articles" class="article-list"></div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function()
        {
            AddHead("主页");
            AddCopyleft();

            fetch('articles/index.json')
                .then(response => {
                    if (!response.ok) throw new Error("无法加载文章列表");
                    return response.json();
                })
                .then(articles => {
                    articles.forEach(article => {
                        AddArticle(article.title, article.time, article.file);
                    });
                })
                .catch(err => {
                    console.error(err);
                    document.getElementById("articles").innerHTML = `<p style="color:red;">加载文章失败: ${err.message}</p>`;
                });
                
        })
    </script>
</body>
</html>
